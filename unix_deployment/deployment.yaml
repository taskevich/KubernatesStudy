apiVersion: apps/v1
kind: Deployment
metadata:
  name: unix-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unix
  template:
    metadata:
      labels:
        app: unix
    spec:
      containers:
        - name: ubuntu
          image: unix-deployment:1.0
          stdin: true
          tty: true
          securityContext:
            runAsUser: 0
            runAsGroup: 1001
          env:
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unix-secrets
                  key: root-password
            - name: TASK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unix-secrets
                  key: task-password
          volumeMounts:
            - name: logs
              mountPath: /logs
          ports:
            - containerPort: 22
              name: ssh
      volumes:
        - name: logs
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: unix-ssh-service
spec:
  selector:
    app: unix
  ports:
    - port: 22
      targetPort: 22
      nodePort: 32000
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: unix-secrets
type: Opaque
data:
  root-password: ZnNvY2lldHk=
  task-password: ZnNvY2lldHk=