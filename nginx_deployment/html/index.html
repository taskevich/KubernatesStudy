<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1 id="currDateTime">Current datetime: </h1>
    <script>
        let currDateTimeElement = document.getElementById("currDateTime");
        currDateTimeElement.innerText = `Current datetime: ${Date()}`;
        function setCurrDateTime() {
            currDateTimeElement.innerText = `Current datetime: ${Date()}`;
        }
        setInterval(setCurrDateTime, 1000);
    </script>
</body>
</html>
